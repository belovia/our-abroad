spring.datasource.url=jdbc:postgresql://localhost:5432/our_abroad
spring.datasource.username=postgres
spring.datasource.password=1595
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# Explicit path (Boot 3.4 defaults to .yaml; YAML master below delegates to db.changelog-master.xml)
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# JWT (override in production via env)
app.jwt.secret=dev
app.jwt.access-token-minutes=10000
app.jwt.refresh-token-days=300